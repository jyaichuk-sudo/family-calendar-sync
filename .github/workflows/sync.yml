name: Hourly Calendar Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # This explicitly gives the action permission to write to your files
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests icalendar

      - name: Run sync script
        run: python calendar_sync.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force add the file in case it is being ignored
          git add -f family_master.ics
          
          # Check if there are changes; if not, create a dummy change to force the build
          if git diff --staged --quiet; then
            echo "No changes in calendar, forcing update for deployment"
            date > last_sync.txt
            git add last_sync.txt
          fi
          
          git commit -m "Manual Calendar Sync Update"
          git push origin main
