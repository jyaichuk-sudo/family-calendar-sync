name: Hourly Calendar Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # This explicitly gives the action permission to write to your files
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests icalendar

      - name: Run sync script
        run: python calendar_sync.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # -f forces the file to be tracked even if it was ignored before
          git add -f family_master.ics
          git commit -m "Automated Calendar Update" || echo "No changes to commit"
          git push origin main
